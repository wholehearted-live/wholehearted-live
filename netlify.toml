[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# metabolicmolly.com (and www) is a domain alias on this Netlify site.
# Its home page goes to Molly's protocol page; any other path goes to the
# same path on wholehearted.live. Netlify uses the first rule that matches.
[[redirects]]
  from   = "https://metabolicmolly.com/"
  to     = "https://wholehearted.live/protocol/"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.metabolicmolly.com/"
  to     = "https://wholehearted.live/protocol/"
  status = 301
  force  = true

# Legal / SMS compliance pages (and the files they load) are served directly on
# metabolicmolly.com with no redirect, so carriers reviewing texting registration
# see them on Molly's own domain. Keep these ABOVE the catch-all rules below.
[[redirects]]
  from   = "https://metabolicmolly.com/privacy"
  to     = "/privacy/index.html"
  status = 200
  force  = true

[[redirects]]
  from   = "https://metabolicmolly.com/sms-terms"
  to     = "/sms-terms/index.html"
  status = 200
  force  = true

[[redirects]]
  from   = "https://metabolicmolly.com/sms-opt-in"
  to     = "/sms-opt-in/index.html"
  status = 200
  force  = true

[[redirects]]
  from   = "https://metabolicmolly.com/_astro/*"
  to     = "/_astro/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "https://metabolicmolly.com/protocol-banner.jpg"
  to     = "/protocol-banner.jpg"
  status = 200
  force  = true

[[redirects]]
  from   = "https://metabolicmolly.com/*"
  to     = "https://wholehearted.live/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.metabolicmolly.com/*"
  to     = "https://wholehearted.live/:splat"
  status = 301
  force  = true

# The April 29 event page was removed; send old shared links to the protocol page.
[[redirects]]
  from   = "/event"
  to     = "/protocol/"
  status = 301

[[redirects]]
  from   = "/event/*"
  to     = "/protocol/"
  status = 301
